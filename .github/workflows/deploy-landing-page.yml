name: Deploy Landing Page to S3 + CloudFront

concurrency:
  group: landing-deploy

on:
  workflow_dispatch: 
  push:
    branches: ["main"]
    paths:
      - "landing/**"
      - "package.json"
      - "package-lock.json"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build landing page
        run: npm run build --workspace=landing
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: github-actions-mock-scores-deploy

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Sync hashed assets
        run: |
          aws s3 sync landing/dist/ s3://${{ secrets.LANDING_S3_BUCKET_NAME }}/ \
            --delete \
            --exclude "*" \
            --include "_astro/*" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync pages and metadata
        run: |
          aws s3 sync landing/dist/ s3://${{ secrets.LANDING_S3_BUCKET_NAME }}/ \
            --delete \
            --exclude "_astro/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.LANDING_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/sitemap*.xml" "/docs*" "/robots.txt"
