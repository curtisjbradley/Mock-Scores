name: Lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `astro check` in the landing workspace type-checks against the compiled
      # outputs of the workspace packages it imports (notably
      # `@mock-scores/standings-dsl/react`), so those must be built first.
      - name: Build workspace packages
        run: npm run build -w shared && npm run build -w standings-dsl

      - name: Run ESLint
        run: npm run lint
