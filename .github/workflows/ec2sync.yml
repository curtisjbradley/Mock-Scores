name: Deploy to EC2

concurrency:
  group: production-deploy
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read
  id-token: write

env:
  RELEASE_BUCKET: mock-scores-built-express-backend-333308930891-us-west-1-an
  APP_DIR: /opt/mock-scores

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: |
          npm run build -w shared
          npm run build -w backend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: github-actions-mock-scores-deploy

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Package release
        run: |
          tar -czf release.tar.gz \
            package.json \
            package-lock.json \
            backend/dist \
            backend/package.json \
            shared/src \
            shared/dist \
            shared/package.json

      - name: Upload release to S3
        run: |
          aws s3 cp \
            release.tar.gz \
            "s3://${RELEASE_BUCKET}/mock-scores/${GITHUB_SHA}.tar.gz"

      - name: Deploy with SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          RELEASE_KEY="mock-scores/${GITHUB_SHA}.tar.gz"
          RELEASE_URI="s3://${RELEASE_BUCKET}/${RELEASE_KEY}"

          DEPLOY_SCRIPT=$(cat <<EOF
          set -euo pipefail

          APP_DIR="/opt/mock-scores"
          RELEASE_DIR="/opt/mock-scores-release"
          ARCHIVE="/tmp/mock-scores-release.tar.gz"

          ENV_BACKUP="/tmp/mock-scores.env"
          START_BACKUP="/tmp/mock-scores-start.sh"

          echo "Starting deployment..."

          #
          # Preserve machine-specific files
          #
          if [ -f "\$APP_DIR/backend/.env" ]; then
            cp "\$APP_DIR/backend/.env" "\$ENV_BACKUP"
          fi

          if [ -f "\$APP_DIR/start.sh" ]; then
            cp "\$APP_DIR/start.sh" "\$START_BACKUP"
          fi

          #
          # Prepare release directory
          #
          rm -rf "\$RELEASE_DIR"
          mkdir -p "\$RELEASE_DIR"

          echo "Downloading release..."

          aws s3 cp \
            "${RELEASE_URI}" \
            "\$ARCHIVE"

          echo "Extracting release..."

          tar -xzf "\$ARCHIVE" -C "\$RELEASE_DIR"

          #
          # Replace application
          #
          rm -rf "\$APP_DIR"
          mv "\$RELEASE_DIR" "\$APP_DIR"

          #
          # Restore machine-specific files
          #
          if [ -f "\$ENV_BACKUP" ]; then
            mkdir -p "\$APP_DIR/backend"
            mv "\$ENV_BACKUP" "\$APP_DIR/backend/.env"
          fi

          if [ -f "\$START_BACKUP" ]; then
            mv "\$START_BACKUP" "\$APP_DIR/start.sh"
            chmod +x "\$APP_DIR/start.sh"
          fi

          cd "\$APP_DIR"

          echo "Installing production dependencies..."

          NODE_ENV=production npm ci --omit=dev

          echo "Restarting application..."

          pm2 restart mock-scores --update-env || \
            pm2 start /opt/mock-scores/start.sh --name mock-scores

          pm2 save

          rm -f "\$ARCHIVE"

          echo "Deployment complete."
          EOF
          )

          PARAMETERS=$(jq -nc \
            --arg script "$DEPLOY_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy mock-scores ${GITHUB_SHA}" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          echo "Waiting for deployment to finish..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          RESULT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID")

          echo "$RESULT" | jq -r '.StandardOutputContent'

          STATUS=$(echo "$RESULT" | jq -r '.Status')

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed with status: $STATUS"
            echo ""
            echo "STDERR:"
            echo "$RESULT" | jq -r '.StandardErrorContent'
            exit 1
          fi

          echo "Deployment succeeded."

      - name: Remove release from S3
        if: always()
        run: |
          aws s3 rm \
            "s3://${RELEASE_BUCKET}/mock-scores/${GITHUB_SHA}.tar.gz" \
            || true