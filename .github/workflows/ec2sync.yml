name: Deploy to EC2

concurrency:
  group: production-deploy
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read
  id-token: write

env:
  APP_DIR: /opt/mock-scores
  RELEASE_BUCKET: ${{ secrets.DEPLOY_BUCKET }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: |
          npm run build -w shared
          npm run build -w backend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: github-actions-mock-scores-deploy

      - name: Package release
        run: |
          tar -czf release.tar.gz \
            package.json \
            package-lock.json \
            backend/dist \
            backend/package.json \
            shared/src \
            shared/dist \
            shared/package.json

      - name: Upload release
        run: |
          aws s3 cp \
            release.tar.gz \
            "s3://${RELEASE_BUCKET}/mock-scores/${GITHUB_SHA}.tar.gz"

      - name: Deploy with SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy mock-scores ${GITHUB_SHA}" \
            --parameters commands="[
              \"set -euo pipefail\",
              \"APP_DIR=/opt/mock-scores\",
              \"RELEASE_DIR=/opt/mock-scores-release\",
              \"ARCHIVE=/tmp/mock-scores-${GITHUB_SHA}.tar.gz\",
              \"ENV_BACKUP=/tmp/mock-scores.env\",
              \"START_BACKUP=/tmp/mock-scores-start.sh\",
              \"rm -rf \\\"\\\$RELEASE_DIR\\\"\",
              \"mkdir -p \\\"\\\$RELEASE_DIR\\\"\",
              \"aws s3 cp s3://${RELEASE_BUCKET}/mock-scores/${GITHUB_SHA}.tar.gz \\\"\\\$ARCHIVE\\\"\",
              \"tar -xzf \\\"\\\$ARCHIVE\\\" -C \\\"\\\$RELEASE_DIR\\\"\",
              \"if [ -f \\\"\\\$APP_DIR/backend/.env\\\" ]; then cp \\\"\\\$APP_DIR/backend/.env\\\" \\\"\\\$ENV_BACKUP\\\"; fi\",
              \"if [ -f \\\"\\\$APP_DIR/start.sh\\\" ]; then cp \\\"\\\$APP_DIR/start.sh\\\" \\\"\\\$START_BACKUP\\\"; fi\",
              \"rm -rf \\\"\\\$APP_DIR\\\"\",
              \"mv \\\"\\\$RELEASE_DIR\\\" \\\"\\\$APP_DIR\\\"\",
              \"if [ -f \\\"\\\$ENV_BACKUP\\\" ]; then mkdir -p \\\"\\\$APP_DIR/backend\\\" && mv \\\"\\\$ENV_BACKUP\\\" \\\"\\\$APP_DIR/backend/.env\\\"; fi\",
              \"if [ -f \\\"\\\$START_BACKUP\\\" ]; then mv \\\"\\\$START_BACKUP\\\" \\\"\\\$APP_DIR/start.sh\\\" && chmod +x \\\"\\\$APP_DIR/start.sh\\\"; fi\",
              \"cd \\\"\\\$APP_DIR\\\"\",
              \"NODE_ENV=production npm ci --omit=dev\",
              \"pm2 restart mock-scores --update-env || pm2 start /opt/mock-scores/start.sh --name mock-scores\",
              \"pm2 save\",
              \"rm -f \\\"\\\$ARCHIVE\\\"\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deployment failed: $STATUS"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'

                exit 1
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'

      - name: Delete release artifact
        if: always()
        run: |
          aws s3 rm \
            "s3://${RELEASE_BUCKET}/mock-scores/${GITHUB_SHA}.tar.gz" \
            || true