name: Deploy to EC2

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            APP_DIR=/opt/mock-scores
            REPO_URL=https://github.com/curtisjbradley/Mock-Scores.git

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Cloning repo..."
              rm -rf "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Building app..."
            npm run build

            echo "Restarting app..."
            pm2 restart mock-scores || pm2 start npm --name mock-scores -- start

            pm2 save
