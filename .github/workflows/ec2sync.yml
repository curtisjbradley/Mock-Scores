name: Deploy to EC2

concurrency:
  group: production-deploy
  cancel-in-progress: false

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ec2sync.yml"

permissions:
  contents: read
  id-token: write

env:
  RELEASE_BUCKET: mock-scores-built-express-backend-333308930891-us-west-1-an
  APP_DIR: /opt/mock-scores

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: |
          npm run build -w shared
          npm run build -w backend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: github-actions-mock-scores-deploy

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Package release
        run: |
          tar -czf release.tar.gz \
            package.json \
            package-lock.json \
            backend/dist \
            backend/package.json \
            shared/src \
            shared/dist \
            shared/package.json

      - name: Upload release to S3
        run: |
          aws s3 cp \
            release.tar.gz \
            "s3://${RELEASE_BUCKET}/mock-scores/${GITHUB_SHA}.tar.gz"

      - name: Deploy with SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          RELEASE_KEY="mock-scores/${GITHUB_SHA}.tar.gz"
          RELEASE_URI="s3://${RELEASE_BUCKET}/${RELEASE_KEY}"

          DEPLOY_SCRIPT=$(cat <<EOF
          #!/bin/bash
          set -euo pipefail

          APP_DIR="${APP_DIR}"
          RELEASE_DIR="/opt/mock-scores-release"
          ARCHIVE="/tmp/mock-scores-release.tar.gz"

          echo "Starting deployment..."

          # Prepare the release without removing the running application.
          rm -rf "\$RELEASE_DIR"
          mkdir -p "\$RELEASE_DIR"

          echo "Downloading release..."
          aws s3 cp "${RELEASE_URI}" "\$ARCHIVE"

          echo "Extracting release..."
          tar -xzf "\$ARCHIVE" -C "\$RELEASE_DIR"

          echo "Installing production dependencies..."
          cd "\$RELEASE_DIR"
          NODE_ENV=production npm ci --omit=dev

          # Preserve machine-specific files in the prepared release.
          if [ -f "\$APP_DIR/backend/.env" ]; then
            cp -p "\$APP_DIR/backend/.env" "\$RELEASE_DIR/backend/.env"
          fi

          if [ -f "\$APP_DIR/start.sh" ]; then
            cp -p "\$APP_DIR/start.sh" "\$RELEASE_DIR/start.sh"
            chmod +x "\$RELEASE_DIR/start.sh"
          fi

          chown -R ec2-user:ec2-user "\$RELEASE_DIR"

          echo "Replacing application..."
          cd /opt
          rm -rf "\$APP_DIR"
          mv "\$RELEASE_DIR" "\$APP_DIR"

          echo "Restarting application as ec2-user..."

          sudo -H -u ec2-user bash -s <<'PM2_SCRIPT'
          set -euo pipefail

          export PM2_HOME=/home/ec2-user/.pm2
          export NODE_ENV=production
          cd /opt/mock-scores

          if pm2 describe mock-scores >/dev/null 2>&1; then
            pm2 restart mock-scores --update-env
          else
            pm2 start npm --name mock-scores -- start
          fi

          pm2 save
          PM2_SCRIPT

          rm -f "\$ARCHIVE"

          echo "Deployment complete."
          EOF
          )

          PARAMETERS=$(jq -nc \
            --arg script "$DEPLOY_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy mock-scores ${GITHUB_SHA}" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"
          echo "Waiting for deployment to finish..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          RESULT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID")

          echo "$RESULT" | jq -r '.StandardOutputContent'

          STATUS=$(echo "$RESULT" | jq -r '.Status')

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed with status: $STATUS"
            echo ""
            echo "STDERR:"
            echo "$RESULT" | jq -r '.StandardErrorContent'
            exit 1
          fi

          echo "Deployment succeeded."

      - name: Remove release from S3
        if: always()
        run: |
          aws s3 rm \
            "s3://${RELEASE_BUCKET}/mock-scores/${GITHUB_SHA}.tar.gz" \
            || true